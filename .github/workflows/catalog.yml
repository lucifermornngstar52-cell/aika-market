name: Обновление каталога

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'build-catalog.mjs'
      - '.github/workflows/catalog.yml'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Собрать catalog.json
        run: node build-catalog.mjs
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
      - name: Закоммитить
        run: |
          git config user.name "Aika Market"
          git config user.email "aika@local"
          git add catalog.json
          git diff --staged --quiet && echo "без изменений" || (git commit -m "catalog: автообновление" && git push)
